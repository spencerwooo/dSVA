[project]
name = "dsva"
version = "1.0.0"
description = "Boosting Generative Adversarial Transferability with Self-supervised Vision Transformer Features"
readme = "README.md"
authors = [{ name = "spencerwooo", email = "spencer.woo@outlook.com" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.3", "timm>=1.0", "torch>=2.7", "torchvision>=0.22"]

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"
